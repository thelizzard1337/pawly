[project]
name = "pawly"
version = "0.1.0"
description = "PawLy API and durable photo search worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.1,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pillow>=11,<13", "pwdlib[argon2]>=0.2,<1", "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1", "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "asgi-lifespan>=2.1,<3", "ruff>=0.9,<1", "pyyaml>=6,<7"]
# CV worker and training/evaluation only. The API/migrate image does not install this group.
ml = ["torch==2.14.1", "torchvision==0.29.1", "numpy>=2.1,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires isolated PostgreSQL/PostGIS",
  "cv_real: requires torch and the pinned pretrained weights (CV image)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
