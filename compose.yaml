x-environment: &environment
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-pawly}
  DB_USER: ${POSTGRES_USER:-pawly}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-unsafe-dev-password}
  JWT_SECRET: ${JWT_SECRET:-unsafe-dev-only-pawly-secret-change-before-production}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000","http://127.0.0.1:8000"]}
  MEDIA_ROOT: /data/media
  # Real pretrained pipeline by default. mock is for plumbing tests and is always labelled.
  CV_MODE: ${CV_MODE:-pretrained_features}
  CV_BACKBONE: ${CV_BACKBONE:-efficientnet_b0}
  CV_BUNDLE_DIR: ${CV_BUNDLE_DIR:-}
  CV_DOG_SCORE_THRESHOLD: ${CV_DOG_SCORE_THRESHOLD:-0.5}
  CV_FUSION: ${CV_FUSION:-embedding-v1}
  CV_FUSION_RGB_WEIGHT: ${CV_FUSION_RGB_WEIGHT:-0.2}
  CV_FUSION_HEADS_WEIGHT: ${CV_FUSION_HEADS_WEIGHT:-0.1}
  CV_TORCH_THREADS: ${CV_TORCH_THREADS:-2}
  SEARCH_TTL_SECONDS: ${SEARCH_TTL_SECONDS:-86400}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend: &backend
  image: pawly-backend:local
  build:
    context: .
    target: runtime
  environment: *environment
  init: true
  logging: *logging

x-cv: &cv
  image: pawly-cv:local
  build:
    context: .
    target: cv-runtime
  environment: *environment
  init: true
  logging: *logging

x-db: &db
  image: pawly-db:local
  build:
    context: docker/db

services:
  db:
    <<: *db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawly}
      POSTGRES_USER: ${POSTGRES_USER:-pawly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unsafe-dev-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - media_data:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 45s

  # Search + indexing worker. The only process that loads torch and the models.
  worker:
    <<: *cv
    command: ["python", "-m", "app.worker"]
    volumes:
      - media_data:/data/media
      - ml_artifacts:/data/ml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s

  # Datasets, feature caches, training runs and exported bundles (never started by `up`).
  ml:
    <<: *cv
    profiles: ["ml"]
    command: ["python", "-m", "app.ml", "--help"]
    environment:
      <<: *environment
      ML_ROOT: /data/ml
    volumes:
      - ml_artifacts:/data/ml
    # DataLoader worker processes pass image tensors through shared memory (default is 64 MB).
    shm_size: 1gb
    restart: "no"

  db-test:
    <<: *db
    profiles: ["test"]
    environment:
      POSTGRES_DB: pawly_test
      POSTGRES_USER: pawly_test
      POSTGRES_PASSWORD: isolated-test-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pawly_test", "-d", "pawly_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *logging

  test:
    profiles: ["test"]
    image: pawly-test:local
    build:
      context: .
      target: test
    environment:
      <<: *environment
      APP_ENV: test
      DEBUG: "false"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:8000","http://127.0.0.1:8000"]'
      # Backend tests use the labelled mock or explicit test doubles; cv_real tests load the
      # pinned weights from the image directly.
      CV_MODE: mock
      CV_FUSION: embedding-v1
      JWT_SECRET: unsafe-dev-only-pawly-secret-change-before-production
      DB_HOST: db-test
      DB_NAME: pawly_test
      DB_USER: pawly_test
      DB_PASSWORD: isolated-test-password
      MEDIA_ROOT: /data/media
      PAWLY_INTEGRATION: "1"
    depends_on:
      db-test:
        condition: service_healthy
    logging: *logging

  smoke:
    profiles: ["smoke"]
    image: pawly-test:local
    build:
      context: .
      target: test
    command: ["python", "-m", "scripts.smoke", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    logging: *logging

volumes:
  pg_data:
  media_data:
  ml_artifacts:
